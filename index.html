<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathQuest: Winter Chronicles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-white font-sans overflow-hidden">

    <!-- Top Stats Bar -->
    <header class="h-16 bg-slate-800 border-b-4 border-indigo-500 flex items-center justify-between px-6 z-20 relative">
        <div class="flex items-center gap-4">
            <div class="bg-indigo-600 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest">MathQuest</div>
            <div class="flex items-center gap-2">
                <span class="text-slate-400 text-sm font-medium">LVL</span>
                <span id="player-level" class="text-xl font-black text-yellow-400">1</span>
            </div>
        </div>

        <div class="flex-1 max-w-md mx-8">
            <div class="flex justify-between text-[10px] uppercase font-bold text-slate-400 mb-1">
                <span>Experience (XP)</span>
                <span id="xp-text">0 / 100</span>
            </div>
            <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden border border-slate-600">
                <div id="xp-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="flex items-center gap-2" id="health-container">
            <!-- Hearts injected by JS -->
        </div>
    </header>

    <div class="flex h-[calc(100vh-64px)]">
        <!-- Game Menu -->
        <aside class="w-72 bg-slate-800 border-r-4 border-slate-700 flex flex-col">
            <div class="p-6 text-center">
                <h2 class="text-lg font-black text-indigo-400 uppercase tracking-tighter">World Map</h2>
                <p class="text-xs text-slate-500">Winter Exam Region</p>
            </div>
            
            <nav class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="text-[10px] font-bold text-slate-500 uppercase px-2 pb-2">Quest Zones</div>
                <button onclick="loadTopic('algebra')" class="game-btn active" id="btn-algebra">
                    <span class="btn-icon">📐</span> Algebra Plains
                </button>
                <button onclick="loadTopic('number')" class="game-btn" id="btn-number">
                    <span class="btn-icon">🔢</span> Number Nexus
                </button>
                <button onclick="loadTopic('geometry')" class="game-btn" id="btn-geometry">
                    <span class="btn-icon">🔺</span> Geometry Gorge
                </button>
                <button onclick="loadTopic('coordinates')" class="game-btn" id="btn-coordinates">
                    <span class="btn-icon">📍</span> Coordinate Coast
                </button>
                
                <div class="text-[10px] font-bold text-slate-500 uppercase px-2 pt-6 pb-2">Archives</div>
                <button onclick="loadTopic('checklist')" class="game-btn" id="btn-checklist">
                    <span class="btn-icon">📜</span> Mastery Scroll
                </button>
            </nav>

            <div class="p-4 border-t-4 border-slate-700 text-center">
                <div class="text-[10px] text-slate-500 uppercase font-bold">Current Objective</div>
                <p class="text-xs text-indigo-300 mt-1">Clear the Winter Mocks!</p>
            </div>
        </aside>

        <!-- Game Viewport -->
        <main class="flex-1 bg-slate-900 relative overflow-y-auto">
            <div id="content-area" class="max-w-4xl mx-auto p-8 py-12">
                <!-- Game content injected here -->
            </div>
        </main>
    </div>

    <!-- Notification Overlay -->
    <div id="notification" class="fixed top-20 left-1/2 -translate-x-1/2 pointer-events-none opacity-0 transition-all duration-300 z-50">
        <div class="bg-yellow-400 text-slate-900 px-6 py-3 rounded-full font-black uppercase tracking-widest shadow-lg scale-90" id="notif-text">
            Level Up!
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
